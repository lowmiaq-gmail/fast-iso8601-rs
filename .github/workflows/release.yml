name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pyproject.toml and Cargo.toml
        required: true
        default: "0.1.0"
        type: string
      confirm_release:
        description: Publish to PyPI and create a formal GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require main and explicit confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_release }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMED" = "true"
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          requested = os.environ["REQUESTED_VERSION"]
          python_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          rust_version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          assert requested == python_version == rust_version == "0.1.0"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("tag=v%s\n" % requested)
          PY

  wheels:
    name: Release wheel / ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x86_64, os: ubuntu-22.04, target: x86_64, manylinux: "2014"}
          - {label: macos-arm64, os: macos-15, target: aarch64, manylinux: "off"}
          - {label: windows-x86_64, os: windows-2022, target: x64, manylinux: "off"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Install and verify immutable wheel
        run: |
          python -m pip install "pytest>=8,<10" hypothesis pytz
          python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1,wheels; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',wheels[0]])"
          python -m pytest -q tests
      - name: Complete upstream and differential
        shell: bash
        run: |
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          CANDIDATE_EXPECTED_ROOT="$candidate_root" CANDIDATE_REQUIRE_NATIVE=1 PYTHON=python bash scripts/run_upstream_full.sh
          python -m venv oracle-venv
          oracle_python=oracle-venv/bin/python
          if [ ! -x "$oracle_python" ]; then oracle_python=oracle-venv/Scripts/python; fi
          python scripts/run_differential.py --oracle-python "$oracle_python" --candidate-python "$(python -c 'import sys; print(sys.executable)')" --cases 10000
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  fallback:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "setuptools>=77" wheel build "pytest>=8,<10" hypothesis pytz
      - run: python scripts/build_fallback_wheel.py --out-dir dist
      - name: Verify exact fallback
        run: |
          python -m pip install --force-reinstall --no-deps dist/*-py3-none-any.whl
          EXPECT_NATIVE=0 python -m pytest -q tests
      - name: Complete upstream and differential
        shell: bash
        run: |
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          CANDIDATE_EXPECTED_ROOT="$candidate_root" PYTHON=python bash scripts/run_upstream_full.sh
          python -m venv oracle-venv
          python scripts/run_differential.py --oracle-python oracle-venv/bin/python --candidate-python "$(python -c 'import sys; print(sys.executable)')" --cases 10000
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-universal-fallback
          path: dist/*-py3-none-any.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "maturin==1.14.1" "pytest>=8,<10" hypothesis pytz
      - name: Build and reconstruct sdist
        run: |
          maturin sdist --out dist
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python -m pip install --force-reinstall --no-deps sdist-wheel/*.whl
          python -m pytest -q tests
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          CANDIDATE_EXPECTED_ROOT="$candidate_root" CANDIDATE_REQUIRE_NATIVE=1 PYTHON=python bash scripts/run_upstream_full.sh
          python -m venv oracle-venv
          python scripts/run_differential.py --oracle-python oracle-venv/bin/python --candidate-python "$(python -c 'import sys; print(sys.executable)')" --cases 10000
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  collect:
    needs: [validate, wheels, fallback, sdist]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Inspect immutable release set
        run: |
          python -m pip install packaging twine
          python scripts/inspect_python_artifacts.py --artifact-dir dist --repository-root "$GITHUB_WORKSPACE" --expected-native-wheels 3
          python -m twine check dist/*
          python scripts/write_checksums.py --artifact-dir dist --output SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-checksums
          path: SHA256SUMS
          if-no-files-found: error

  benchmark:
    needs: [validate, collect]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-distributions
          path: dist
      - name: Benchmark exact macOS arm64 wheel
        shell: bash
        run: |
          wheels=(dist/*-cp38-abi3-macosx_11_0_arm64.whl)
          test "${#wheels[@]}" = 1
          python -m pip install --no-deps "${wheels[0]}"
          python scripts/run_benchmark.py --artifact "${wheels[0]}" --output release-benchmark.json --markdown release-benchmark.md --iterations 10000 --repeats 15 --warmup 1000
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-benchmark
          path: |
            release-benchmark.json
            release-benchmark.md
          if-no-files-found: error

  publish-pypi:
    needs: [validate, collect, benchmark]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/fast-iso8601-rs/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/

  public-native:
    name: Public PyPI native / ${{ matrix.label }}
    needs: [validate, publish-pypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x86_64, os: ubuntu-22.04}
          - {label: macos-arm64, os: macos-15}
          - {label: windows-x86_64, os: windows-2022}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install from public index with retry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python -c "import os,subprocess,sys,time; spec='fast-iso8601-rs=='+os.environ['RELEASE_VERSION']; attempts=6; [(subprocess.run([sys.executable,'-m','pip','install','--no-cache-dir','--index-url','https://pypi.org/simple',spec]).returncode==0 and sys.exit(0)) or time.sleep(20) for _ in range(attempts)]; sys.exit('public PyPI install failed')"
      - name: Verify public native artifact
        shell: bash
        run: |
          python -m pip install "pytest>=8,<10" hypothesis pytz
          python -c "import importlib.util; native=importlib.util.find_spec('iso8601._native'); assert native and native.origin.endswith(('.so','.pyd')),native"
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          CANDIDATE_EXPECTED_ROOT="$candidate_root" CANDIDATE_REQUIRE_NATIVE=1 PYTHON=python bash scripts/run_upstream_full.sh
          python -m pytest -q tests

  public-fallback-python37:
    needs: [validate, publish-pypi]
    runs-on: ubuntu-22.04
    container: python:3.7.17-buster
    steps:
      - uses: actions/checkout@v4
      - name: Install public fallback
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install "pip<24" "pytest==7.4.4" "hypothesis==6.79.4" pytz
          for attempt in 1 2 3 4 5 6; do
            python -m pip install --no-cache-dir --index-url https://pypi.org/simple "fast-iso8601-rs==$RELEASE_VERSION" && break
            test "$attempt" = 6 && exit 1
            sleep 20
          done
      - name: Verify public fallback
        run: |
          EXPECT_NATIVE=0 python -m pytest -q tests
          python -c "import importlib.util,iso8601; assert importlib.util.find_spec('iso8601._native') is None; assert iso8601.__file__.endswith('.py')"
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          CANDIDATE_EXPECTED_ROOT="$candidate_root" PYTHON=python bash scripts/run_upstream_full.sh

  github-release-last:
    needs: [validate, benchmark, public-native, public-fallback-python37]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-distributions
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-checksums
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-benchmark
          path: release-assets
      - name: Create formal GitHub Release only after public reinstall gates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "fast-iso8601-rs $TAG" --notes-file docs/RELEASE-NOTES-0.1.0.md
